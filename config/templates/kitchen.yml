# ============================================================================
#  KITCHEN TEMPLATE
#  Copy of the general template, tuned for a kitchen: the fixed services matter
#  more than anywhere else in a house, and the camera views are different.
#  Run `design check` after editing.
# ============================================================================

name: "Kitchen refit"
client: ""

# ---------------------------------------------------------------- the brief
brief:
  what_it_is: >
    A family kitchen. Cooking, washing up and breakfast happen here, and it is
    also the route to the garden door, so it is worked in and walked through
    at the same time.

  register: "A working family kitchen, used hard every day."

  # In a kitchen this list is usually about services and appliances, not sentiment.
  must_appear:
    - "The existing range cooker"
    - "A table or bar people can eat breakfast at"

  fixed_furniture_note: ""

  problems:
    - id: P1
      text: "Not enough worktop between the sink and the hob"
    - id: P2
      text: "The through-route to the garden cuts across the working triangle"

  constraints:
    - "The soil stack and the waste run cannot move"
    - "Repair any damp or rot at source before specifying a finish"
    - "Keep a clear working triangle between sink, hob and fridge"

# ---------------------------------------------------------------- the room
room:
  name: "Kitchen"
  units: m
  ceiling_height: 2.5
  confirmed: false

  # A galley or L-shaped kitchen is often not a simple rectangle. Use `polygon`
  # and list the corners clockwise from the entrance-left corner.
  shape:
    type: rectangle
    width: 3.0
    length: 4.6

  # key_dimensions: {across: 3.0, along: 4.6}

  wall_names:
    w1: {name: "Entrance wall", role: entrance}
    w2: {name: "Run wall - hob and tall units", role: flank}
    w3: {name: "Window wall - sink under the window", role: far}
    w4: {name: "Run wall - fridge and larder", role: flank}

  openings:
    - {tag: D1, type: doorway, wall: w1, pos: 0.9, width: 0.9, sill: 0.0, head: 2.05, desc: "Opening to the hall"}
    - {tag: W1, type: window, wall: w3, pos: 1.5, width: 1.2, sill: 0.95, head: 2.1, desc: "Window over the sink"}

  # Services are the things that decide a kitchen plan. Record them.
  features:
    - {tag: SVP, kind: soil stack, wall: w2, pos: 3.9, width: 0.25, height: 2.5, z: 0.0, desc: "Soil stack - cannot move"}
    - {tag: GAS, kind: gas supply, wall: w2, pos: 1.6, width: 0.1, height: 0.1, z: 0.5, desc: "Gas point"}

  shell_notes:
    - "Worktops run at 900 mm; wall units at 1500 mm to underside unless stated."
    - "The window sill is above worktop height, so the run passes beneath it."

  existing:
    floor: ""
    ceiling: ""
    walls: ""

  notes:
    - "Measure the actual appliance sizes before drawing any run - nominal 600 mm is often not 600 mm."
    - "Figures read from photographs must be checked with a tape before joinery."

# ---------------------------------------------------------------- deliverables
deliverables:
  directions: 5
  aspect_ratio: "16:9"
  elevations: [w1, w2, w3, w4]
  iso_hide_walls: [w1, w4]

  views:
    - id: hero-in
      caption: "From the doorway, looking in"
      drawings: [plan, iso]
      photos: []
      camera: >
        CAMERA - HERO. Standing in the doorway looking into the kitchen.
        28 mm lens, eye level 1.55 m. Both runs visible.
    - id: worktop
      caption: "Along the main worktop"
      drawings: [elev-w2, plan]
      photos: []
      camera: >
        CAMERA - THE RUN. Square-on to the main run of units from about 2 m,
        35 mm lens, eye level 1.55 m. Shows worktop, splashback, wall units and
        appliance placement as one elevation. Do not show the opposite wall.
    - id: sink
      caption: "At the sink, looking out of the window"
      drawings: [elev-w3, plan]
      photos: []
      camera: >
        CAMERA - AT THE SINK. Standing at the sink facing the window wall from
        about 1 m, 35 mm lens, eye level 1.55 m.
    - id: corner
      caption: "High corner overview"
      drawings: [plan, iso]
      photos: []
      camera: >
        CAMERA - HIGH CORNER. From a corner, 1.85 m up, angled down across the
        room. 24 mm lens. A three-quarter overview showing the whole plan and
        the working triangle.

# ---------------------------------------------------------------- style
style:
  richness: ""

# ---------------------------------------------------------------- rendering
render:
  backend: codex
  max_spend_usd: 10
